name = "citywalk-api"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Deployed as Cloudflare Pages `_worker.js` (Advanced Mode).
# Front + API share the same origin (laidou-laile.pages.dev),
# so no CORS middleware is required at runtime.

[vars]
NODE_ENV = "production"
LLM_BASE_URL = "https://api.deepseek.com/v1"
LLM_MODEL = "deepseek-v4-pro"
LLM_TIMEOUT_MS = "35000"
AMAP_TIMEOUT_MS = "10000"

# Secrets (set with `wrangler pages secret put`, never here):
#   LLM_API_KEY
#   AMAP_WEB_API_KEY
