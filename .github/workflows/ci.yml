name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Placeholder values only. Unit tests mock every LLM/Amap call and CI
      # must never consume a real third-party API.
      LLM_API_KEY: ci-mock-key
      AMAP_WEB_API_KEY: ci-mock-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run deterministic server tests
        run: npm test

      - name: Build Pages bundle
        run: npm run build
