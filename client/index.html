<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#5b8c5e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>来都来了</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window._AMapSecurityConfig = {
        securityJsCode: 'f581ad95104bd9dd92aaaf3cd983ecb9',
      }
      window._amap_error = ''
      window._amap_script_loaded = false
      window._amap_sdk_ready = false
    </script>
    <script src="https://webapi.amap.com/loader.js"
            onload="window._amap_script_loaded=true"
            onerror="window._amap_error='Script network error'"></script>
    <!-- Eager-load the full Amap SDK so it's ready when the map component mounts -->
    <script>
      (function preloadAmap() {
        var key = 'a281efc44143fc4d3680ed164609a565'
        var plugins = ['AMap.Geocoder','AMap.AutoComplete','AMap.PlaceSearch','AMap.Geolocation']
        function tryLoad() {
          if (window.AMapLoader) {
            window.AMapLoader.load({ key: key, version: '2.0', plugins: plugins })
              .then(function(AMap) {
                window.AMap = AMap
                window._amap_sdk_ready = true
                console.log('🗺️ Amap SDK preloaded')
              })
              .catch(function(err) {
                window._amap_error = 'SDK preload: ' + String(err)
                console.error('Amap preload failed:', err)
              })
          } else {
            // loader.js hasn't executed yet, retry
            setTimeout(tryLoad, 50)
          }
        }
        tryLoad()
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
