<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ee4d24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>来都来了</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window._AMapSecurityConfig = {
        securityJsCode: 'f581ad95104bd9dd92aaaf3cd983ecb9',
      }
      window._amap_error = ''
      window._amap_script_loaded = false
      window.addEventListener('error', function(e) {
        if (e.target && (e.target as any).src && (e.target as any).src.includes('webapi.amap.com')) {
          window._amap_error = 'Script load failed: ' + ((e.target as any).src)
        }
      }, true)
    </script>
    <script src="https://webapi.amap.com/v2/map?v=2.0&key=a281efc44143fc4d3680ed164609a565&plugin=AMap.Geocoder,AMap.AutoComplete,AMap.PlaceSearch,AMap.Geolocation"
            onload="window._amap_script_loaded=true"
            onerror="window._amap_error='Script network error'"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
