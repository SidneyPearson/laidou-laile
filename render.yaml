services:
  - type: web
    name: laidou-laile-api
    env: node
    region: singapore
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: AMAP_WEB_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: LLM_FALLBACK_MODEL
        value: deepseek-v4-pro
      - key: LLM_TIMEOUT_MS
        value: "90000"
